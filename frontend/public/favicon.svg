      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <rect
    x="1"
    y="15"
    width="11"
    height="11"
    rx="3"
    fill="none"
    stroke="url(#tempora-gradient)"
    stroke-width="1.6"
  />
  <line x1="3.5" y1="18.5" x2="9.5" y2="18.5" stroke="url(#tempora-gradient)" stroke-width="1.3" stroke-linecap="round" />
  <line x1="3.5" y1="22" x2="8" y2="22" stroke="url(#tempora-gradient)" stroke-width="1.3" stroke-linecap="round" />
</svg>